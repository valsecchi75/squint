<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"> <text x="0" y="14" fill="#8b949e" font-size="12" font-weight="600">Confidence calibration — 26 hand-written targets across 5 files</text> <text x="0" y="30" fill="#8b949e" font-size="11">Each dot is one target. Green = the window contained the true line. Red = it did not.</text> <!-- axis --> <line x1="60" y1="170" x2="700" y2="170" stroke="#8b949e" stroke-width="1" opacity="0.25"/> <text x="60" y="190" fill="#8b949e" font-size="10">0.0</text><text x="186" y="190" fill="#8b949e" font-size="10">0.2</text> <text x="314" y="190" fill="#8b949e" font-size="10">0.4</text><text x="442" y="190" fill="#8b949e" font-size="10">0.6</text> <text x="570" y="190" fill="#8b949e" font-size="10">0.8</text><text x="690" y="190" fill="#8b949e" font-size="10">1.0</text> <text x="330" y="208" fill="#8b949e" font-size="11">confidence reported by Jev</text> <!-- shipped floor at 0.60 -> x = 60 + 0.60*640 = 444 --> <line x1="444" y1="60" x2="444" y2="176" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 3"/> <text x="452" y="72" fill="#58a6ff" font-size="11" font-weight="600">0.60 — shipped floor</text> <text x="452" y="88" fill="#8b949e" font-size="10">nothing below this is narrowed</text> <!-- failures: 0.22 0.23 0.24 0.34 0.41 => x = 60 + c*640 --> <circle cx="201" cy="146" r="6" fill="#f85149"/><text x="193" y="134" fill="#8b949e" font-size="10">142</text> <circle cx="207" cy="122" r="6" fill="#f85149"/><text x="199" y="110" fill="#8b949e" font-size="10">212</text> <circle cx="214" cy="146" r="6" fill="#f85149"/><text x="206" y="166" fill="#8b949e" font-size="10">117</text> <circle cx="278" cy="146" r="6" fill="#f85149"/><text x="270" y="134" fill="#8b949e" font-size="10">127</text> <circle cx="322" cy="122" r="6" fill="#f85149"/><text x="314" y="110" fill="#8b949e" font-size="10">305</text> <text x="150" y="252" font-size="11" fill="#f85149" font-weight="600">every miss is at 0.41 or below</text> <text x="150" y="268" fill="#8b949e" font-size="10">numbers above each dot = how many lines the pick was off by</text> <!-- successes: 0.18 .24 .30 .31 .47 .54 .55 .63 .64 .66 .66 .69 .71 .71 .73 .79 .83 .84 .86 .89 .90 .93 .97 --> <circle cx="175" cy="158" r="5" fill="#3fb950"/><circle cx="214" cy="158" r="5" fill="#3fb950"/> <circle cx="252" cy="158" r="5" fill="#3fb950"/><circle cx="258" cy="158" r="5" fill="#3fb950"/> <circle cx="361" cy="158" r="5" fill="#3fb950"/><circle cx="406" cy="158" r="5" fill="#3fb950"/> <circle cx="412" cy="158" r="5" fill="#3fb950"/> <circle cx="463" cy="158" r="5" fill="#3fb950"/><circle cx="470" cy="158" r="5" fill="#3fb950"/> <circle cx="482" cy="158" r="5" fill="#3fb950"/><circle cx="489" cy="158" r="5" fill="#3fb950"/> <circle cx="514" cy="158" r="5" fill="#3fb950"/><circle cx="521" cy="158" r="5" fill="#3fb950"/> <circle cx="527" cy="158" r="5" fill="#3fb950"/><circle cx="540" cy="158" r="5" fill="#3fb950"/> <circle cx="566" cy="158" r="5" fill="#3fb950"/><circle cx="591" cy="158" r="5" fill="#3fb950"/> <circle cx="598" cy="158" r="5" fill="#3fb950"/><circle cx="610" cy="158" r="5" fill="#3fb950"/> <circle cx="630" cy="158" r="5" fill="#3fb950"/><circle cx="636" cy="158" r="5" fill="#3fb950"/> <circle cx="655" cy="158" r="5" fill="#3fb950"/><circle cx="681" cy="158" r="5" fill="#3fb950"/> <text x="0" y="296" fill="#8b949e" font-size="11">The floor stays at 0.60 rather than dropping to 0.42: lowering it buys 3 more narrowings out of 26 and puts the</text> <text x="0" y="312" fill="#8b949e" font-size="11">threshold within 0.01 of the worst failure ever seen. Five failures cannot estimate that margin.</text>
</svg>
