<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"> <text x="0" y="14" fill="#8b949e" font-size="12" font-weight="600">Paired A/B — cost per run, same question in both arms</text> <text x="0" y="30" fill="#8b949e" font-size="11">12 pairs, haiku, identical sources. Grey = hook off, green = hook on.</text> <line x1="46" y1="250" x2="700" y2="250" stroke="#8b949e" stroke-width="1" opacity="0.25"/> <!-- A1 --> <rect x="60" y="132" width="18" height="118" fill="#6e7681"/><rect x="80" y="180" width="18" height="70" fill="#3fb950"/> <text x="60" y="264" fill="#8b949e" font-size="11">A1</text><text x="60" y="126" fill="#3fb950" font-size="11" font-weight="600">-41%</text> <!-- A2 --> <rect x="112" y="128" width="18" height="122" fill="#6e7681"/><rect x="132" y="187" width="18" height="63" fill="#3fb950"/> <text x="112" y="264" fill="#8b949e" font-size="11">A2</text><text x="112" y="122" fill="#3fb950" font-size="11" font-weight="600">-48%</text> <!-- A3 --> <rect x="164" y="119" width="18" height="131" fill="#6e7681"/><rect x="184" y="185" width="18" height="65" fill="#3fb950"/> <text x="164" y="264" fill="#8b949e" font-size="11">A3</text><text x="164" y="113" fill="#3fb950" font-size="11" font-weight="600">-50%</text> <!-- A4 --> <rect x="216" y="169" width="18" height="81" fill="#6e7681"/><rect x="236" y="182" width="18" height="68" fill="#3fb950"/> <text x="216" y="264" fill="#8b949e" font-size="11">A4</text><text x="216" y="163" fill="#3fb950" font-size="11" font-weight="600">-17%</text> <!-- A5 --> <rect x="268" y="150" width="18" height="100" fill="#6e7681"/><rect x="288" y="181" width="18" height="69" fill="#3fb950"/> <text x="268" y="264" fill="#8b949e" font-size="11">A5</text><text x="268" y="144" fill="#3fb950" font-size="11" font-weight="600">-31%</text> <!-- A6 --> <rect x="320" y="155" width="18" height="95" fill="#6e7681"/><rect x="340" y="190" width="18" height="60" fill="#3fb950"/> <text x="320" y="264" fill="#8b949e" font-size="11">A6</text><text x="320" y="149" fill="#3fb950" font-size="11" font-weight="600">-37%</text> <line x1="390" y1="60" x2="390" y2="262" stroke="#8b949e" stroke-width="1" opacity="0.25" stroke-dasharray="3 3"/> <text x="402" y="76" fill="#8b949e" font-size="11" font-weight="600">Negative control — files under 400 lines</text> <text x="402" y="92" fill="#8b949e" font-size="11">the hook cannot fire here, so the arms must not separate</text> <rect x="430" y="196" width="18" height="54" fill="#6e7681"/><rect x="450" y="199" width="18" height="51" fill="#3fb950"/> <text x="430" y="264" fill="#8b949e" font-size="11">B1</text><text x="430" y="190" fill="#8b949e" font-size="10">-7%</text> <rect x="490" y="194" width="18" height="56" fill="#6e7681"/><rect x="510" y="197" width="18" height="53" fill="#3fb950"/> <text x="490" y="264" fill="#8b949e" font-size="11">B2</text><text x="490" y="188" fill="#8b949e" font-size="10">-5%</text> <rect x="550" y="192" width="18" height="58" fill="#6e7681"/><rect x="570" y="195" width="18" height="55" fill="#3fb950"/> <text x="550" y="264" fill="#8b949e" font-size="11">B3</text><text x="550" y="186" fill="#8b949e" font-size="10">-3%</text> <text x="402" y="240" fill="#8b949e" font-size="11">mean -2.5%, spread 6.3%</text> <text x="402" y="256" fill="#8b949e" font-size="11" font-weight="600">null — as it must be</text> <text x="0" y="288" fill="#8b949e" font-size="11">Where it fires: mean -37.3%, within-pair spread 10.4%, all pairs the same direction. Quality 18/18 in both arms.</text>
</svg>
